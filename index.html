<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Hero Section</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="hero">
    <video class="hero-video" autoplay muted loop playsinline poster="poster.jpg">
      <source src="background-video.mp4" type="video/mp4">
      Your browser doesn't support video backgrounds.
    </video>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Hawaii Awaits</h1>
      <p>Take a vacation and cruise to the Hawaiian beach</p>
      <br> 
      <button>Book a vacation now!</button>
    </div>
  </section>
</body>
</html>
